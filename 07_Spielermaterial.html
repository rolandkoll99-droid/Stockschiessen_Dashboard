<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Spielermaterial – Trainingsportal ESV Grein</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #1f5e3a;
            --red: #b93a32;
            --gold: #ffdf8c;
            --dark: #102417;
            --light: #eef5e9;
            --border: #d7e4cf;
            --bg-main: #0a0e14;
            --bg-panel: #131b24;
            --line:rgba(255,255,255,0.08);
            --text-main: #eef2f6;
            --text-dim: #8a97a6;
            --accent: #33c5ff;
            --accent-hover: #5fd4ff;
            --font-display: "Space Grotesk","Inter",sans-serif;
            --font-body: "Inter",Segoe UI,Arial,sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(160deg, var(--bg-main), #0a0d12);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .topbar{
             position: sticky;
            top: 0;
            z-index: 501;
             background:var(--bg-panel);
            border-bottom:1px solid var(--line);
            padding:8px 14px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-shrink:0;
            font-size:15px;
}
        .topbar a {
            color: var(--text-dim);
            text-decoration: none;
            transition: color .15s ease;
        }
        .topbar a:hover { color: var(--text-main); }
        .topbar a.logout {
            border: 1px solid var(--line);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
        }
        .topbar a.logout:hover { border-color: var(--accent); }

        .header h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .header h1::before {
            content: "Modul 07";
            display: block;
            font-family: var(--font-body);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .header-actions button:active { transform: scale(0.95); }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-success { background: #2e7d32; color: white; }
        .btn-success:hover { background: #388e3c; }

        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #c62828; }

        .btn-gold { background: var(--gold); color: black; }
        .btn-gold:hover { background: #f0c860; }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text-main);
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        /* Tabs: Plattenmaterial / Stingel */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--bg-panel);
            color: var(--text-dim);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            text-align: left;
        }
        .tab-btn .tab-icon { font-size: 1.3rem; margin-right: 8px; }
        .tab-btn .tab-count {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .tab-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--text-main); }
        .tab-btn.active {
            background: rgba(51,197,255,0.12);
            border-color: var(--accent);
            color: var(--text-main);
        }
        .tab-btn.active .tab-count { color: var(--accent); }

        .catalog-section { display: none; }
        .catalog-section.active { display: block; }

        /* Statistik */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Tabelle */
        .table-wrapper {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: rgba(255,255,255,0.04);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        .item-id {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            background: rgba(255,255,255,0.06);
            padding: 2px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        .field-badge {
            background: rgba(51, 197, 255, 0.15);
            color: var(--accent);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .action-buttons button:active { transform: scale(0.92); }

        .btn-edit { background: var(--gold); color: black; }
        .btn-edit:hover { background: #f0c860; }

        .btn-delete { background: var(--red); color: white; }
        .btn-delete:hover { background: #c62828; }

        /* Formular - Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            animation: modalIn 0.25s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h2 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .modal .sub {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .modal label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text-dim);
        }

        .modal input, .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal input:focus, .modal select:focus {
            border-color: var(--accent);
        }

        .modal input::placeholder {
            color: var(--text-dim);
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .modal .modal-actions button:active { transform: scale(0.95); }

        .modal .modal-actions .btn-cancel {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
        }
        .modal .modal-actions .btn-cancel:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel);
            border: 1px solid var(--line);
            color: var(--text-main);
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 99999;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.success { border-color: #4caf50; }
        .toast.error { border-color: var(--red); }
        .toast.info { border-color: var(--accent); }

        /* Leerzustand */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-dim);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .hint-box {
            background: rgba(255,223,140,0.08);
            border: 1px solid rgba(255,223,140,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header-actions {
                justify-content: center;
            }
            .action-buttons {
                flex-direction: column;
                gap: 4px;
            }
            .action-buttons button {
                width: 100%;
                padding: 6px 12px;
            }
            td, th {
                padding: 10px 12px;
                font-size: 0.8rem;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .tabs { flex-direction: column; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .header { padding: 14px 16px; }
            .header h1 { font-size: 1.3rem; }
            .modal { padding: 20px; }
            .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar">
    <a href="dashboard.html">&larr; Zurück zum Dashboard</a>
    <a class="logout" href="#" onclick="logout(); return false;">Abmelden</a>
</div>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>Spielermaterial</h1>
    </div>

    <div class="hint-box">
        📊 Diese Daten (Plattenmaterial &amp; Stingel) stehen für die Trainingsanalyse zur Verfügung und werden lokal auf diesem Gerät gespeichert.
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tabBtn-platten" onclick="switchTab('platten')">
            <span class="tab-icon">📀</span>Plattenmaterial
            <span class="tab-count" id="tabCount-platten">0 Einträge</span>
        </button>
        <button class="tab-btn" id="tabBtn-stingel" onclick="switchTab('stingel')">
            <span class="tab-icon">🏒</span>Stingel
            <span class="tab-count" id="tabCount-stingel">0 Einträge</span>
        </button>
    </div>

    <!-- Plattenmaterial -->
    <div class="catalog-section active" id="section-platten">
        <div class="header-actions" style="margin-bottom:16px;">
            <button class="btn-primary" onclick="openAddModal('platten')">➕ Plattenmaterial hinzufügen</button>
            <button class="btn-gold" onclick="exportExcel('platten')">📥 Excel exportieren</button>
            <button class="btn-outline" onclick="document.getElementById('importFile-platten').click()">📤 Excel importieren</button>
            <input type="file" id="importFile-platten" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(event,'platten')">
        </div>
        <div class="stats" id="statsContainer-platten"></div>
        <div class="table-wrapper">
            <table id="table-platten">
                <thead><tr id="tableHead-platten"></tr></thead>
                <tbody id="tableBody-platten"></tbody>
            </table>
        </div>
    </div>

    <!-- Stingel -->
    <div class="catalog-section" id="section-stingel">
        <div class="header-actions" style="margin-bottom:16px;">
            <button class="btn-primary" onclick="openAddModal('stingel')">➕ Stingel hinzufügen</button>
            <button class="btn-gold" onclick="exportExcel('stingel')">📥 Excel exportieren</button>
            <button class="btn-outline" onclick="document.getElementById('importFile-stingel').click()">📤 Excel importieren</button>
            <input type="file" id="importFile-stingel" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(event,'stingel')">
        </div>
        <div class="stats" id="statsContainer-stingel"></div>
        <div class="table-wrapper">
            <table id="table-stingel">
                <thead><tr id="tableHead-stingel"></tr></thead>
                <tbody id="tableBody-stingel"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Eintrag hinzufügen/bearbeiten -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
        <h2 id="modalTitle">Eintrag hinzufügen</h2>
        <div class="sub" id="modalSub">Neuen Eintrag aufnehmen</div>

        <form id="itemForm" onsubmit="saveItem(event)">
            <input type="hidden" id="editCatalog" value="">
            <input type="hidden" id="editIndex" value="-1">
            <div id="modalFields"></div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Abbrechen</button>
                <button type="submit" class="btn-primary" id="modalSaveBtn">Speichern</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// KATALOG-DEFINITIONEN (Plattenmaterial & Stingel)
// ============================================================
const CATALOGS = {
    platten: {
        key: 'esv_grein_plattenmaterial',
        idPrefix: 'PM',
        label: 'Plattenmaterial',
        exportName: 'Plattenmaterial',
        fields: [
            { key: 'bezeichnung', label: 'Bezeichnung / Farbe', placeholder: 'z.B. Rot – Hart', required: true, aliases: ['bezeichnung', 'farbe', 'name'] },
            { key: 'haerte', label: 'Härtegrad', placeholder: 'z.B. Hart, Mittel, Weich', aliases: ['härtegrad', 'haerte', 'härte'] },
            { key: 'hersteller', label: 'Hersteller', placeholder: 'z.B. Union, Wewox', aliases: ['hersteller', 'marke'] },
            { key: 'bemerkung', label: 'Bemerkung', placeholder: 'z.B. geeignet für nasses Eis', aliases: ['bemerkung', 'notiz', 'kommentar'] }
        ]
    },
    stingel: {
        key: 'esv_grein_stingel',
        idPrefix: 'ST',
        label: 'Stingel',
        exportName: 'Stingel',
        fields: [
            { key: 'bezeichnung', label: 'Bezeichnung', placeholder: 'z.B. Carbon Pro', required: true, aliases: ['bezeichnung', 'name'] },
            { key: 'laenge', label: 'Länge (cm)', placeholder: 'z.B. 110', aliases: ['länge', 'laenge', 'länge (cm)'] },
            { key: 'material', label: 'Material', placeholder: 'z.B. Carbon, Holz, Aluminium', aliases: ['material'] },
            { key: 'bemerkung', label: 'Bemerkung', placeholder: 'z.B. Ersatz-Stingel', aliases: ['bemerkung', 'notiz', 'kommentar'] }
        ]
    }
};

const XLSX_CDN_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

// ============================================================
// SPEICHER-HELFER (lokal am Raspberry, pro Katalog eigener Key)
// ============================================================
function getEntries(catKey) {
    const cat = CATALOGS[catKey];
    try {
        const data = localStorage.getItem(cat.key);
        if (data) {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed)) return parsed;
        }
    } catch (e) {}
    return [];
}

function saveEntries(catKey, entries) {
    const cat = CATALOGS[catKey];
    localStorage.setItem(cat.key, JSON.stringify(entries));
    render(catKey);
}

function getNextId(catKey, entries) {
    const cat = CATALOGS[catKey];
    const nums = entries.map(e => parseInt(String(e.id).replace(cat.idPrefix + '-', '')) || 0);
    const max = Math.max(...nums, 0);
    return cat.idPrefix + '-' + String(max + 1).padStart(3, '0');
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ============================================================
// TABS
// ============================================================
function switchTab(catKey) {
    Object.keys(CATALOGS).forEach(k => {
        document.getElementById('section-' + k).classList.toggle('active', k === catKey);
        document.getElementById('tabBtn-' + k).classList.toggle('active', k === catKey);
    });
}

// ============================================================
// RENDER
// ============================================================
function renderAll() {
    Object.keys(CATALOGS).forEach(render);
}

function render(catKey) {
    const cat = CATALOGS[catKey];
    const entries = getEntries(catKey);

    // Tab-Zähler
    document.getElementById('tabCount-' + catKey).textContent = `${entries.length} Eintr${entries.length === 1 ? 'ag' : 'äge'}`;

    // Stats
    const statsEl = document.getElementById('statsContainer-' + catKey);
    statsEl.innerHTML = `
        <div class="stat-card">
            <div class="number">${entries.length}</div>
            <div class="label">${cat.label} gesamt</div>
        </div>
        <div class="stat-card">
            <div class="number">${entries.length ? escapeHtml(entries[entries.length - 1][cat.fields[0].key] || '-') : '-'}</div>
            <div class="label">Zuletzt hinzugefügt</div>
        </div>
    `;

    // Tabellenkopf
    const head = document.getElementById('tableHead-' + catKey);
    head.innerHTML = `<th>ID</th>${cat.fields.map(f => `<th>${f.label}</th>`).join('')}<th style="text-align:right;">Aktionen</th>`;

    // Tabellenkörper
    const tbody = document.getElementById('tableBody-' + catKey);
    if (entries.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="${cat.fields.length + 2}">
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <h3>Kein ${cat.label} vorhanden</h3>
                        <p style="color:var(--text-dim);">Füge den ersten Eintrag hinzu oder importiere eine Excel-Datei.</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML = entries.map((entry, index) => `
        <tr>
            <td><span class="item-id">${escapeHtml(entry.id)}</span></td>
            ${cat.fields.map((f, i) => i === 0
                ? `<td><strong>${escapeHtml(entry[f.key] || '')}</strong></td>`
                : `<td>${entry[f.key] ? `<span class="field-badge">${escapeHtml(entry[f.key])}</span>` : '<span style="color:var(--text-dim);">–</span>'}</td>`
            ).join('')}
            <td style="text-align:right;">
                <div class="action-buttons" style="justify-content:flex-end;">
                    <button class="btn-edit" onclick="editItem('${catKey}', ${index})">✏️ Bearbeiten</button>
                    <button class="btn-delete" onclick="deleteItem('${catKey}', ${index})">🗑️ Löschen</button>
                </div>
            </td>
        </tr>
    `).join('');
}

// ============================================================
// MODAL / CRUD
// ============================================================
function renderModalFields(catKey, values) {
    const cat = CATALOGS[catKey];
    values = values || {};
    document.getElementById('modalFields').innerHTML = cat.fields.map(f => `
        <label for="field-${f.key}">${f.label}${f.required ? ' *' : ''}</label>
        <input type="text" id="field-${f.key}" placeholder="${escapeHtml(f.placeholder || '')}"
               value="${escapeHtml(values[f.key] || '')}" ${f.required ? 'required' : ''}>
    `).join('');
}

function openAddModal(catKey) {
    const cat = CATALOGS[catKey];
    document.getElementById('modalTitle').textContent = `${cat.label} hinzufügen`;
    document.getElementById('modalSub').textContent = `Neuen ${cat.label}-Eintrag aufnehmen`;
    document.getElementById('modalSaveBtn').textContent = 'Hinzufügen';
    document.getElementById('editCatalog').value = catKey;
    document.getElementById('editIndex').value = '-1';
    renderModalFields(catKey);
    document.getElementById('modalOverlay').classList.add('show');
    const first = document.getElementById('field-' + cat.fields[0].key);
    if (first) first.focus();
}

function editItem(catKey, index) {
    const cat = CATALOGS[catKey];
    const entries = getEntries(catKey);
    const entry = entries[index];
    if (!entry) return;

    document.getElementById('modalTitle').textContent = `${cat.label} bearbeiten`;
    document.getElementById('modalSub').textContent = `Bearbeite „${entry[cat.fields[0].key] || entry.id}"`;
    document.getElementById('modalSaveBtn').textContent = 'Aktualisieren';
    document.getElementById('editCatalog').value = catKey;
    document.getElementById('editIndex').value = index;
    renderModalFields(catKey, entry);
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

function saveItem(event) {
    event.preventDefault();
    const catKey = document.getElementById('editCatalog').value;
    const cat = CATALOGS[catKey];
    const editIndex = parseInt(document.getElementById('editIndex').value);

    const values = {};
    for (const f of cat.fields) {
        values[f.key] = document.getElementById('field-' + f.key).value.trim();
    }

    const requiredField = cat.fields.find(f => f.required);
    if (requiredField && !values[requiredField.key]) {
        showToast(`Bitte "${requiredField.label}" ausfüllen.`, 'error');
        return;
    }

    let entries = getEntries(catKey);

    if (editIndex >= 0 && editIndex < entries.length) {
        entries[editIndex] = { ...entries[editIndex], ...values };
        showToast(`✅ "${values[cat.fields[0].key]}" wurde aktualisiert.`, 'success');
    } else {
        const newEntry = { id: getNextId(catKey, entries), ...values };
        entries.push(newEntry);
        showToast(`✅ "${values[cat.fields[0].key]}" wurde hinzugefügt (ID: ${newEntry.id}).`, 'success');
    }

    saveEntries(catKey, entries);
    closeModal();
}

function deleteItem(catKey, index) {
    const cat = CATALOGS[catKey];
    const entries = getEntries(catKey);
    const entry = entries[index];
    if (!entry) return;

    if (confirm(`„${entry[cat.fields[0].key] || entry.id}" (${entry.id}) wirklich löschen?`)) {
        entries.splice(index, 1);
        saveEntries(catKey, entries);
        showToast(`🗑️ "${entry[cat.fields[0].key] || entry.id}" wurde gelöscht.`, 'info');
    }
}

// ============================================================
// EXCEL EXPORT / IMPORT (SheetJS, wie in der Spielerverwaltung)
// ============================================================
function loadXlsxLib(callback, onError) {
    if (typeof XLSX !== 'undefined') { callback(); return; }
    const script = document.createElement('script');
    script.src = XLSX_CDN_URL;
    script.onload = callback;
    script.onerror = onError;
    document.head.appendChild(script);
}

function exportExcel(catKey) {
    const cat = CATALOGS[catKey];
    const entries = getEntries(catKey);
    if (entries.length === 0) {
        showToast(`Kein ${cat.label} zum Exportieren vorhanden.`, 'error');
        return;
    }

    loadXlsxLib(function () {
        try {
            const data = entries.map(e => {
                const row = { 'ID': e.id };
                cat.fields.forEach(f => { row[f.label] = e[f.key] || ''; });
                return row;
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, cat.exportName);
            ws['!cols'] = [{ wch: 10 }, ...cat.fields.map(() => ({ wch: 22 }))];
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${cat.exportName}_${new Date().toISOString().slice(0, 10)}.xlsx`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast(`📥 ${entries.length} ${cat.label}-Einträge exportiert.`, 'success');
        } catch (err) {
            showToast('Fehler beim Export: ' + err.message, 'error');
        }
    }, function () {
        showToast('Fehler beim Laden der Excel-Bibliothek. Bitte Internetverbindung prüfen.', 'error');
    });
}

function findColumnValue(row, aliases) {
    // Sucht flexibel nach der passenden Spalte, unabhängig von Groß-/Kleinschreibung
    const keys = Object.keys(row);
    for (const alias of aliases) {
        const match = keys.find(k => k.trim().toLowerCase() === alias.toLowerCase());
        if (match && row[match] !== undefined && row[match] !== null) {
            return String(row[match]).trim();
        }
    }
    return '';
}

function importExcel(event, catKey) {
    const cat = CATALOGS[catKey];
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        loadXlsxLib(function () {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                if (!jsonData || jsonData.length === 0) {
                    showToast('Die Datei enthält keine Daten.', 'error');
                    return;
                }

                let entries = getEntries(catKey);
                let added = 0;
                let skipped = 0;
                const requiredField = cat.fields.find(f => f.required) || cat.fields[0];

                jsonData.forEach(row => {
                    const values = {};
                    // Erst das exakte Spalten-Label prüfen (passend zu unserem eigenen Excel-Export),
                    // danach die kürzeren Aliase (für den Import fremder/handgemachter Excel-Dateien).
                    cat.fields.forEach(f => { values[f.key] = findColumnValue(row, [f.label, ...f.aliases]); });
                    const idFromFile = findColumnValue(row, ['id']);

                    if (!values[requiredField.key]) {
                        skipped++;
                        return;
                    }

                    const exists = entries.some(entry =>
                        (entry[requiredField.key] || '').toLowerCase() === values[requiredField.key].toLowerCase()
                    );

                    if (!exists) {
                        entries.push({ id: idFromFile || getNextId(catKey, entries), ...values });
                        added++;
                    } else {
                        skipped++;
                    }
                });

                if (added > 0) {
                    saveEntries(catKey, entries);
                    showToast(`📥 ${added} ${cat.label}-Einträge importiert. ${skipped} übersprungen (bereits vorhanden).`, 'success');
                } else {
                    showToast(`ℹ️ Keine neuen Einträge gefunden. ${skipped} waren bereits vorhanden.`, 'info');
                }
            } catch (err) {
                showToast('Fehler beim Verarbeiten der Datei: ' + err.message, 'error');
            }
        }, function () {
            showToast('Fehler beim Laden der Excel-Bibliothek. Bitte Internetverbindung prüfen.', 'error');
        });
    };
    reader.readAsArrayBuffer(file);
    event.target.value = '';
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + (type || 'info');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        if (document.getElementById('modalOverlay').classList.contains('show')) {
            closeModal();
        }
    }
});
