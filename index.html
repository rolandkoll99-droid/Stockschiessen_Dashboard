<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Anmeldung – Trainingsportal ESV Grein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#1f5e3a;
    --red:#b93a32;
    --gold:#ffdf8c;
    --bg-main:#0a0e14;
    --bg-panel:#131b24;
    --line:rgba(255,255,255,0.08);
    --text-main:#eef2f6;
    --text-dim:#8a97a6;
    --accent:#33c5ff;
    --accent-hover:#5fd4ff;
    --font-display:"Space Grotesk","Inter",sans-serif;
    --font-body:"Inter",Segoe UI,Arial,sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body{
    height:100%;
    height:100dvh;
}

body{
    font-family:var(--font-body);
    background:
        radial-gradient(900px 500px at 15% -10%, rgba(51,197,255,0.12), transparent 60%),
        radial-gradient(700px 500px at 100% 110%, rgba(31,94,58,0.18), transparent 60%),
        linear-gradient(160deg,var(--bg-main),#050709);
    color:var(--text-main);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.gate-card{
    width:100%;
    max-width:400px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:24px;
    padding:38px 34px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    text-align:center;
    animation: cardIn .35s ease;
}
@keyframes cardIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
}

.gate-icon{
    font-size:2.6rem;
    margin-bottom:6px;
}

.gate-eyebrow{
    font-family:var(--font-body);
    text-transform:uppercase;
    letter-spacing:0.16em;
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:4px;
}

.gate-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:-0.01em;
    margin-bottom:6px;
}

.gate-sub{
    font-size:0.85rem;
    color:var(--text-dim);
    margin-bottom:26px;
    line-height:1.5;
}

.pw-field{
    position:relative;
    margin-bottom:16px;
}

.pw-field input{
    width:100%;
    border:2px solid var(--line);
    background:#0d1420;
    color:var(--text-main);
    border-radius:14px;
    padding:15px 48px 15px 16px;
    font-size:1.05rem;
    letter-spacing:0.05em;
    font-family:inherit;
    outline:none;
    transition: border-color .15s;
}
.pw-field input:focus{
    border-color:var(--accent);
}
.pw-field input.shake{
    border-color:var(--red);
    animation: shakeField .4s ease;
}
@keyframes shakeField{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(3px); }
}

.pw-toggle{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:1.2rem;
    cursor:pointer;
    padding:8px 10px;
    border-radius:8px;
    line-height:1;
}
.pw-toggle:hover{ color:var(--text-main); background:rgba(255,255,255,0.06); }

.gate-error{
    color:#ff8a80;
    font-size:0.82rem;
    font-weight:600;
    min-height:18px;
    margin-bottom:14px;
    opacity:0;
    transition:opacity .15s;
}
.gate-error.show{ opacity:1; }

.gate-submit{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:1.05rem;
    font-weight:700;
    font-family:inherit;
    background:var(--accent);
    color:#05161e;
    cursor:pointer;
    touch-action:manipulation;
    transition: transform .1s, background .15s;
}
.gate-submit:hover{ background:var(--accent-hover); }
.gate-submit:active{ transform:scale(0.97); }

.gate-footnote{
    margin-top:22px;
    font-size:0.72rem;
    color:var(--text-dim);
    line-height:1.5;
}

.gate-redirect{
    font-size:0.85rem;
    color:var(--text-dim);
}
</style>
</head>
<body>

<div class="gate-card" id="gateCard">
    <div class="gate-icon">🔒</div>
    <div class="gate-eyebrow">Trainingsportal</div>
    <div class="gate-title">🥌 ESV Grein</div>
    <div class="gate-sub">Bitte gib den Zugangscode ein, um zum Trainingsportal zu gelangen.</div>

    <form id="gateForm" autocomplete="off">
        <div class="pw-field">
            <input type="password" id="pwInput" placeholder="Zugangscode" autofocus inputmode="text">
            <button type="button" class="pw-toggle" id="pwToggle" title="Passwort anzeigen/verbergen">👁</button>
        </div>
        <div class="gate-error" id="gateError">Falscher Code – bitte nochmal versuchen.</div>
        <button type="submit" class="gate-submit">Anmelden</button>
    </form>

    <div class="gate-footnote">Der Zugang ist ausschließlich für Mitglieder von ESV Grein bestimmt.</div>
</div>

<script>
// ============================================================
// ZUGANGSSPERRE – Trainingsportal ESV Grein
// ============================================================
// Diese Seite ist die Startseite des Portals (bei GitHub Pages automatisch
// die aufgerufene index.html im Repo-Root, lokal einfach die Datei, die man
// zuerst öffnet). Erst nach richtigem Code wird zur eigentlichen Startseite
// des Portals weitergeleitet und der Zugang im Browser gemerkt (localStorage) -
// alle anderen Module prüfen über auth.js (requireGate()/requireLogin()), ob
// dieser Zugang gesetzt ist, und schicken sonst wieder hierher zurück.
//
// WICHTIG zur Sicherheit: Da es sich um eine rein statische Seite ohne
// Server/Datenbank handelt (GitHub Pages / lokale Dateien), kann der Code hier
// niemals wirklich geheim sein - er steht im Quelltext dieser Datei. Das ist
// also kein Schutz gegen technisch versierte Personen, sondern eine einfache
// Hürde, damit der Link nicht "aus Versehen" weiterverwendet wird bzw. nicht
// jeder zufällige Besucher sofort alle Trainingsdaten sieht.
//
// PASSWORT ÄNDERN: einfach den Text zwischen den Anführungszeichen bei
// SITE_PASSWORD unten ersetzen und die Datei speichern (bei GitHub: Datei im
// Repo bearbeiten und committen). Groß-/Kleinschreibung wird beachtet.
const SITE_PASSWORD = 'eisstock2026';

// ZIEL NACH ERFOLGREICHER ANMELDUNG: Name der Datei, zu der weitergeleitet
// wird - Standard ist die Dashboard-Übersicht. Falls die Startseite des
// restlichen Portals bei dir anders heißt oder in einem Unterordner liegt,
// hier den Dateinamen/Pfad anpassen.
const REDIRECT_TARGET = 'dashboard.html';

// Speicher-Schlüssel, den auth.js in den anderen Modulen ebenfalls prüft.
const AUTH_STORAGE_KEY = 'esv_grein_auth_ok';

function isAuthenticated() {
    try { return localStorage.getItem(AUTH_STORAGE_KEY) === '1'; } catch (e) { return false; }
}

// Wer schon angemeldet ist (Code bereits einmal richtig eingegeben, noch nicht
// abgemeldet), soll die Startseite nicht jedes Mal erneut sehen müssen -
// automatische Weiterleitung, sobald die Seite lädt.
if (isAuthenticated()) {
    window.location.replace(REDIRECT_TARGET);
}

const form = document.getElementById('gateForm');
const input = document.getElementById('pwInput');
const errorEl = document.getElementById('gateError');
const toggleBtn = document.getElementById('pwToggle');

form.addEventListener('submit', function (e) {
    e.preventDefault();
    const value = input.value.trim();

    if (value.length > 0 && value === SITE_PASSWORD) {
        try { localStorage.setItem(AUTH_STORAGE_KEY, '1'); } catch (e) {}
        window.location.href = REDIRECT_TARGET;
        return;
    }

    errorEl.classList.add('show');
    input.classList.remove('shake');
    // reflow, damit die Shake-Animation bei mehrfachem Fehlversuch neu startet
    void input.offsetWidth;
    input.classList.add('shake');
    input.value = '';
    input.focus();
});

toggleBtn.addEventListener('click', function () {
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    toggleBtn.textContent = isHidden ? '🙈' : '👁';
    input.focus();
});
</script>

</body>
</html>
