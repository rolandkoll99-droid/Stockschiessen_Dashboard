<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESV Grein – Trainingssystem</title>
    <!-- jsPDF für PDF-Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1a3a24 0%, #0e2a18 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }

        .header {
            background: #1f5e3a;
            color: white;
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            border-bottom: 3px solid #ffdf8c;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-svg {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-text .esv {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffdf8c;
        }

        .logo-text .sport {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #c8e6c9;
        }

        .logo-text .union {
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #a5d6a7;
        }

        .header-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 14px 4px 10px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .control-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #e8f0e5;
        }

        .control-group span {
            background: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #1a2e1f;
            min-width: 40px;
            text-align: center;
        }

        .btn-reset {
            background: #b93a32;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-reset:hover {
            background: #a02e27;
            transform: scale(1.02);
        }

        .btn-spectator {
            background: #2d5a8a;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-spectator:hover {
            background: #1e4a78;
            transform: scale(1.02);
        }

        .btn-pdf {
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pdf:hover {
            background: #a93226;
            transform: scale(1.02);
        }

        .arena {
            padding: 20px 28px 28px;
            background: #f6faf5;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .score-card {
            background: white;
            border-radius: 24px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 8px solid #1f5e3a;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
        }

        .score-card.red {
            border-bottom-color: #b93a32;
        }

        .team-meta {
            display: flex;
            flex-direction: column;
        }

        .team-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e3a27;
        }

        .team-score {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1;
            color: #1f5e3a;
        }

        .score-card.red .team-score {
            color: #b93a32;
        }

        .team-wins {
            background: #1a2e1f;
            color: white;
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .team-wins span {
            font-size: 1.5rem;
        }

        .kehren-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px 40px;
            background: white;
            padding: 18px 20px 20px;
            border-radius: 28px;
            box-shadow: inset 0 0 0 1px #e3ede3;
        }

        .kehren-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .kehren-column-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1d4a2d;
            margin-bottom: 6px;
            border-bottom: 2px dashed #d4e2d4;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .kehre-row {
            display: grid;
            grid-template-columns: 60px 1fr 48px;
            align-items: center;
            gap: 6px;
            background: #fafcfa;
            border-radius: 16px;
            padding: 6px 12px;
            border: 2px solid #dde9dd;
            transition: 0.15s;
            cursor: default;
        }

        .kehre-row.active {
            border-color: #2b7a4b;
            background: #eef9ef;
            box-shadow: 0 0 0 2px #b3d9b3;
        }

        .kehre-row.completed {
            border-color: #cfb87c;
            background: #fcf8ed;
        }

        .kehre-number {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1f3d27;
            text-align: center;
        }

        .points-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .point-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 2px solid #d0dfd0;
            background: white;
            font-weight: 700;
            font-size: 1rem;
            color: #1d3422;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .point-btn:hover {
            background: #e1efe1;
            border-color: #6e9f6e;
        }

        .point-btn.active-point {
            background: #1f5e3a;
            border-color: #1f5e3a;
            color: white;
        }

        .point-btn:active {
            transform: scale(0.92);
        }

        .kehre-value {
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            color: #1f3d27;
        }

        .footer {
            background: #edf4ed;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            border-top: 2px solid #c7dac7;
        }

        .footer-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-left button {
            background: #eef5ee;
            border: 2px solid #b6ceb6;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            color: #1d4028;
            cursor: pointer;
            transition: 0.12s;
            font-size: 0.95rem;
        }

        .footer-left button:hover {
            background: #d8e8d8;
            border-color: #7fa87f;
        }

        .footer-left .gold {
            background: #ffdf8c;
            border-color: #d4a84a;
        }

        .footer-left .gold:hover {
            background: #f5d074;
        }

        .footer-right {
            font-weight: 500;
            color: #2f543a;
            background: #dce8dc;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .kehren-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .kehren-dialog-overlay.show {
            display: flex;
        }

        .kehren-dialog {
            background: white;
            border-radius: 32px;
            padding: 32px 36px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .kehren-dialog h3 {
            color: #1f5e3a;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .kehren-dialog p {
            color: #3b5443;
            margin-bottom: 16px;
        }

        .kehren-dialog select {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdd2bd;
            border-radius: 16px;
            font-size: 1rem;
            margin-bottom: 22px;
        }

        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .dialog-buttons button {
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-cancel {
            background: #dbe3db;
            color: #1f3d27;
        }

        .btn-confirm {
            background: #b93a32;
            color: white;
        }

        .btn-confirm:hover {
            background: #a02e27;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #121f16;
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .toast.show {
            opacity: 1;
        }

        /* Zuschauer-Fenster Styles */
        .spectator-window {
            background: #0a1a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spectator-window .scoreboard {
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 0;
            max-width: 1200px;
            width: 100%;
        }

        .spectator-window .score-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 40px 50px;
            border-radius: 30px;
        }

        .spectator-window .score-card .team-name {
            font-size: 3rem;
            color: #e8f5e9;
        }

        .spectator-window .score-card .team-score {
            font-size: 10rem;
            color: #ffdf8c;
        }

        .spectator-window .score-card.red .team-score {
            color: #ff8a80;
        }

        .spectator-window .score-card .team-wins {
            background: rgba(255, 255, 255, 0.15);
            font-size: 2.5rem;
            padding: 12px 32px;
        }

        .spectator-window .score-card .team-wins span {
            font-size: 3rem;
        }

        .spectator-window .score-card .team-meta {
            gap: 12px;
        }

        .spectator-window .spectator-info {
            color: #a0b8a0;
            font-size: 1.8rem;
            margin-top: 30px;
            letter-spacing: 2px;
            text-align: center;
        }

        .spectator-window .spectator-title {
            color: #ffdf8c;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .spectator-window .spectator-title .logo-svg {
            width: 60px;
            height: 60px;
        }

        @media (max-width: 900px) {
            body {
                padding: 12px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .scoreboard {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .kehren-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .point-btn {
                width: 44px;
                height: 44px;
            }
            .spectator-window .score-card .team-score {
                font-size: 6rem;
            }
            .spectator-window .score-card .team-name {
                font-size: 2rem;
            }
            .spectator-window .score-card {
                padding: 25px;
            }
            .spectator-window .scoreboard {
                gap: 30px;
            }
            .logo-svg {
                width: 36px;
                height: 36px;
            }
            .logo-text .esv {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-controls {
                justify-content: center;
            }
            .control-group {
                flex-wrap: wrap;
                justify-content: center;
            }
            .arena {
                padding: 14px;
            }
            .footer {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-left {
                justify-content: center;
            }
            .footer-right {
                text-align: center;
            }
            .spectator-window .score-card .team-score {
                font-size: 4rem;
            }
            .spectator-window .score-card .team-name {
                font-size: 1.5rem;
            }
            .spectator-window .score-card {
                padding: 20px;
            }
            .spectator-window .scoreboard {
                gap: 20px;
            }
            .spectator-window .spectator-title {
                font-size: 1.5rem;
            }
            .logo-svg {
                width: 30px;
                height: 30px;
            }
            .logo-text .esv {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- HEADER -->
        <div class="header">
            <h1>
                <div class="logo-container">
                    <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="48" fill="#1f5e3a" stroke="#ffdf8c" stroke-width="2"/>
                        <text x="50" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#ffdf8c" letter-spacing="1">ESV</text>
                        <text x="50" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#c8e6c9" letter-spacing="2">SPORT</text>
                        <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="#a5d6a7" letter-spacing="3">union</text>
                        <line x1="20" y1="45" x2="80" y2="45" stroke="#ffdf8c" stroke-width="0.5" opacity="0.3"/>
                        <line x1="20" y1="70" x2="80" y2="70" stroke="#ffdf8c" stroke-width="0.5" opacity="0.3"/>
                    </svg>
                    <div class="logo-text">
                        <span class="esv">ESV Grein</span>
                        <span class="sport">SPORT</span>
                        <span class="union">union</span>
                    </div>
                </div>
            </h1>
            <div class="header-controls">
                <div class="control-group">
                    <label>👥 Spieler</label>
                    <span>4</span>
                </div>
                <div class="control-group">
                    <label>🏆 Meisterschaft</label>
                    <span>5 Durchgänge</span>
                </div>
                <div class="control-group">
                    <label>🔄 Kehren</label>
                    <span>6</span>
                </div>
                <button class="btn-spectator" onclick="openSpectatorWindow()">
                    👁️ Zuschauer
                </button>
                <button class="btn-pdf" onclick="exportPDF()">
                    📄 PDF
                </button>
                <button class="btn-reset" onclick="fullReset()">↺</button>
            </div>
        </div>

        <!-- ARENA -->
        <div class="arena" id="arenaContainer">
            <!-- Dynamisch befüllt -->
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <div class="footer-left">
                <button class="gold" onclick="evaluateGame()">🏁 Spiel werten</button>
                <button onclick="resetGame()">🔄 Neues Spiel</button>
                <button onclick="openKehrenDialog()">🗑️ Kehre löschen</button>
            </div>
            <div class="footer-right">@Roland Koll · v2.8</div>
        </div>
    </div>

    <!-- DIALOG -->
    <div class="kehren-dialog-overlay" id="kehrenDialog" onclick="closeKehrenDialog(event)">
        <div class="kehren-dialog" onclick="event.stopPropagation();">
            <h3>Kehre löschen</h3>
            <p>Wähle die zu löschende Kehre aus:</p>
            <select id="kehrenSelectDialog"></select>
            <div class="dialog-buttons">
                <button class="btn-cancel" onclick="closeKehrenDialog()">Abbrechen</button>
                <button class="btn-confirm" onclick="confirmDeleteKehre()">Löschen</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ---------- STATE ----------
        const state = {
            kehren: 6,
            maxRounds: 5,
            playerCount: 4,
            arena: createArena(1),
            spectatorWindow: null,
            history: []
        };

        function createArena(id) {
            return {
                id,
                teamA: 'Mannschaft W',
                teamB: 'Mannschaft E',
                pointsA: Array(6).fill(null),
                pointsB: Array(6).fill(null),
                winsA: 0,
                winsB: 0,
                round: 1
            };
        }

        // ---------- LOGO SVG ----------
        function getLogoSvg(width = 60, height = 60) {
            return `<svg width="${width}" height="${height}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="48" fill="#1f5e3a" stroke="#ffdf8c" stroke-width="2"/>
                        <text x="50" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#ffdf8c" letter-spacing="1">ESV</text>
                        <text x="50" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#c8e6c9" letter-spacing="2">SPORT</text>
                        <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="#a5d6a7" letter-spacing="3">union</text>
                        <line x1="20" y1="45" x2="80" y2="45" stroke="#ffdf8c" stroke-width="0.5" opacity="0.3"/>
                        <line x1="20" y1="70" x2="80" y2="70" stroke="#ffdf8c" stroke-width="0.5" opacity="0.3"/>
                    </svg>`;
        }

        // ---------- SPECTATOR WINDOW ----------
        function openSpectatorWindow() {
            if (state.spectatorWindow && !state.spectatorWindow.closed) {
                state.spectatorWindow.focus();
                toast('Zuschauer-Fenster bereits geöffnet');
                return;
            }

            const width = 1200;
            const height = 800;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;

            state.spectatorWindow = window.open(
                '',
                'SpectatorWindow',
                `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
            );

            if (!state.spectatorWindow) {
                toast('Bitte erlauben Sie Popups für diese Seite');
                return;
            }

            updateSpectatorWindow();

            if (state.spectatorInterval) {
                clearInterval(state.spectatorInterval);
            }
            state.spectatorInterval = setInterval(() => {
                if (state.spectatorWindow && !state.spectatorWindow.closed) {
                    updateSpectatorWindow();
                } else {
                    clearInterval(state.spectatorInterval);
                    state.spectatorInterval = null;
                }
            }, 500);

            toast('👁️ Zuschauer-Fenster geöffnet');
        }

        function updateSpectatorWindow() {
            if (!state.spectatorWindow || state.spectatorWindow.closed) return;

            const arena = state.arena;
            const scoreA = sum(arena.pointsA);
            const scoreB = sum(arena.pointsB);
            const maxPoints = state.maxRounds * 2;

            const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>ESV Grein – Zuschauer</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
                    body { 
                        background: #0a1a0f; 
                        min-height: 100vh; 
                        display: flex; 
                        justify-content: center; 
                        align-items: center; 
                        padding: 20px;
                    }
                    .spectator-container {
                        max-width: 1400px;
                        width: 100%;
                        background: rgba(255,255,255,0.02);
                        border-radius: 40px;
                        padding: 40px;
                        backdrop-filter: blur(10px);
                        border: 1px solid rgba(255,255,255,0.05);
                    }
                    .spectator-title {
                        color: #ffdf8c;
                        font-size: 2.5rem;
                        font-weight: 700;
                        text-align: center;
                        margin-bottom: 40px;
                        letter-spacing: 3px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 15px;
                    }
                    .scoreboard {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 60px;
                        margin-bottom: 30px;
                    }
                    .score-card {
                        background: rgba(255,255,255,0.05);
                        backdrop-filter: blur(10px);
                        border: 2px solid rgba(255,255,255,0.1);
                        padding: 40px 50px;
                        border-radius: 30px;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    }
                    .score-card .team-meta {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                    }
                    .score-card .team-name {
                        font-size: 3rem;
                        color: #e8f5e9;
                        font-weight: 700;
                    }
                    .score-card .team-score {
                        font-size: 10rem;
                        font-weight: 800;
                        line-height: 1;
                        color: #ffdf8c;
                    }
                    .score-card.red .team-score {
                        color: #ff8a80;
                    }
                    .score-card .team-wins {
                        background: rgba(255,255,255,0.15);
                        color: white;
                        padding: 12px 32px;
                        border-radius: 40px;
                        font-weight: 700;
                        font-size: 2.5rem;
                        display: flex;
                        align-items: center;
                        gap: 10px;
                    }
                    .score-card .team-wins span {
                        font-size: 3rem;
                    }
                    .spectator-info {
                        color: #a0b8a0;
                        font-size: 1.8rem;
                        text-align: center;
                        letter-spacing: 2px;
                        margin-top: 10px;
                    }
                    .spectator-info .highlight {
                        color: #ffdf8c;
                        font-weight: 700;
                    }
                    .spectator-status {
                        color: #8aa88a;
                        font-size: 1.2rem;
                        text-align: center;
                        margin-top: 20px;
                        padding: 10px;
                        background: rgba(255,255,255,0.03);
                        border-radius: 16px;
                        border: 1px solid rgba(255,255,255,0.05);
                    }
                    @media (max-width: 900px) {
                        .scoreboard { grid-template-columns: 1fr; gap: 30px; }
                        .score-card .team-score { font-size: 6rem; }
                        .score-card .team-name { font-size: 2rem; }
                        .score-card { padding: 25px; }
                        .spectator-title { font-size: 1.8rem; }
                        .spectator-info { font-size: 1.3rem; }
                    }
                    @media (max-width: 600px) {
                        .score-card .team-score { font-size: 4rem; }
                        .score-card .team-name { font-size: 1.5rem; }
                        .score-card { padding: 20px; flex-direction: column; gap: 15px; }
                        .score-card .team-wins { font-size: 1.5rem; padding: 8px 20px; }
                        .spectator-title { font-size: 1.4rem; }
                        .spectator-info { font-size: 1rem; }
                    }
                </style>
            </head>
            <body>
                <div class="spectator-container">
                    <div class="spectator-title">
                        ${getLogoSvg(60, 60)}
                        ESV Grein · Zuschauer
                    </div>
                    <div class="scoreboard">
                        <div class="score-card">
                            <div class="team-meta">
                                <div class="team-name">⚪ ${arena.teamA}</div>
                                <div class="team-score">${scoreA}</div>
                            </div>
                            <div class="team-wins"><span>🏆</span> ${arena.winsA}</div>
                        </div>
                        <div class="score-card red">
                            <div class="team-meta">
                                <div class="team-name">🔴 ${arena.teamB}</div>
                                <div class="team-score">${scoreB}</div>
                            </div>
                            <div class="team-wins"><span>🏆</span> ${arena.winsB}</div>
                        </div>
                    </div>
                    <div class="spectator-info">
                        Durchgang <span class="highlight">${arena.round}</span> / ${state.maxRounds} · 
                        Max. Punkte: <span class="highlight">${maxPoints}</span>
                    </div>
                    <div class="spectator-status">
                        ${arena.round > state.maxRounds ? '🏁 Meisterschaft beendet' : '🔄 Läuft...'}
                        ${hasChampion(arena) ? ' 🏆 Champion gekürt!' : ''}
                    </div>
                </div>
            </body>
            </html>
            `;

            state.spectatorWindow.document.write(html);
            state.spectatorWindow.document.close();
        }

        // ---------- PDF EXPORT (mit korrekten Gesamt-Stockpunkten) ----------
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = 210;
            const pageHeight = 297;
            let y = 20;

            // Titel
            doc.setFontSize(24);
            doc.setTextColor(31, 94, 58);
            doc.text('ESV Grein - Trainingsbericht', pageWidth / 2, y, { align: 'center' });
            y += 12;

            doc.setFontSize(12);
            doc.setTextColor(100);
            doc.text(`Datum: ${new Date().toLocaleDateString('de-DE')}`, pageWidth / 2, y, { align: 'center' });
            y += 10;

            doc.setFontSize(14);
            doc.setTextColor(31, 94, 58);
            doc.text(`Mannschaften: ${state.arena.teamA} vs ${state.arena.teamB}`, pageWidth / 2, y, { align: 'center' });
            y += 16;

            if (state.history.length === 0) {
                doc.setFontSize(12);
                doc.setTextColor(150);
                doc.text('Keine Daten vorhanden. Bitte spielen Sie mindestens einen Durchgang.', pageWidth / 2, y, { align: 'center' });
                doc.save('ESV_Grein_Trainingsbericht.pdf');
                return;
            }

            // Tabelle mit allen Durchgängen
            const tableData = [];
            let totalA = 0,
                totalB = 0;

            state.history.forEach((entry, idx) => {
                const round = idx + 1;
                const pointsA = entry.pointsA || [];
                const pointsB = entry.pointsB || [];
                const sumA = pointsA.reduce((s, v) => s + (v || 0), 0);
                const sumB = pointsB.reduce((s, v) => s + (v || 0), 0);

                // Stockpunkte als String (K1: 3, K2: 2, ...)
                const stockA = pointsA.map((v, i) => `K${i+1}: ${v ?? '-'}`).join(' | ');
                const stockB = pointsB.map((v, i) => `K${i+1}: ${v ?? '-'}`).join(' | ');

                tableData.push([
                    `Durchgang ${round}`,
                    `${sumA}`,
                    stockA,
                    `${sumB}`,
                    stockB,
                    entry.result || '-'
                ]);

                totalA += sumA;
                totalB += sumB;
            });

            // GESAMT-Zeile mit korrekten Gesamt-Stockpunkten
            const totalStockA = state.history.reduce((sum, entry) => sum + (entry.pointsA || []).reduce((s, v) => s + (v || 0), 0), 0);
            const totalStockB = state.history.reduce((sum, entry) => sum + (entry.pointsB || []).reduce((s, v) => s + (v || 0), 0), 0);

            tableData.push([
                'GESAMT',
                `${totalA}`,
                `Σ Stock: ${totalStockA}`,
                `${totalB}`,
                `Σ Stock: ${totalStockB}`,
                ''
            ]);

            // Tabelle erstellen
            doc.autoTable({
                startY: y,
                head: [
                    ['Durchgang', 'Punkte W', 'Stockpunkte W', 'Punkte E', 'Stockpunkte E', 'Ergebnis']
                ],
                body: tableData,
                theme: 'grid',
                styles: {
                    fontSize: 8,
                    cellPadding: 2,
                    overflow: 'linebreak'
                },
                headStyles: {
                    fillColor: [31, 94, 58],
                    textColor: [255, 255, 255],
                    fontSize: 9,
                    fontStyle: 'bold'
                },
                columnStyles: {
                    0: { cellWidth: 22 },
                    1: { cellWidth: 16, halign: 'center' },
                    2: { cellWidth: 58 },
                    3: { cellWidth: 16, halign: 'center' },
                    4: { cellWidth: 58 },
                    5: { cellWidth: 22, halign: 'center' }
                },
                didDrawCell: function(data) {
                    // Letzte Zeile (Gesamt) hervorheben
                    if (data.row.index === tableData.length - 1 && data.section === 'body') {
                        doc.setFillColor(240, 248, 240);
                        doc.rect(data.cell.x, data.cell.y, data.cell.width, data.cell.height, 'F');
                    }
                }
            });

            // Endstand
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(14);
            doc.setTextColor(31, 94, 58);
            doc.text('🏆 ENDSTAND', pageWidth / 2, finalY, { align: 'center' });

            const maxPoints = state.maxRounds * 2;
            const winnerA = state.arena.winsA >= maxPoints;
            const winnerB = state.arena.winsB >= maxPoints;

            doc.setFontSize(12);
            doc.setTextColor(50);
            const resultText = winnerA ? `${state.arena.teamA} gewinnt die Meisterschaft!` :
                winnerB ? `${state.arena.teamB} gewinnt die Meisterschaft!` :
                state.arena.winsA > state.arena.winsB ? `${state.arena.teamA} gewinnt die Meisterschaft!` :
                state.arena.winsB > state.arena.winsA ? `${state.arena.teamB} gewinnt die Meisterschaft!` :
                'Meisterschaft unentschieden!';

            doc.text(resultText, pageWidth / 2, finalY + 10, { align: 'center' });
            doc.text(`${state.arena.teamA}: ${state.arena.winsA} Punkte  |  ${state.arena.teamB}: ${state.arena.winsB} Punkte`,
                pageWidth / 2, finalY + 20, { align: 'center' });

            // Gesamt-Stockpunkte im Endstand (korrigiert)
            doc.setFontSize(10);
            doc.setTextColor(80);
            doc.text(`Gesamt-Stockpunkte: ${state.arena.teamA} ${totalStockA}  |  ${state.arena.teamB} ${totalStockB}`,
                pageWidth / 2, finalY + 30, { align: 'center' });

            // Footer
            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text(`Erstellt mit ESV Grein Trainingssystem v2.8 · ${new Date().toLocaleString('de-DE')}`,
                pageWidth / 2, pageHeight - 10, { align: 'center' });

            doc.save('ESV_Grein_Trainingsbericht.pdf');
            toast('📄 PDF wurde erstellt und heruntergeladen');
        }

        // ---------- RENDER ----------
        function render() {
            const container = document.getElementById('arenaContainer');
            container.innerHTML = renderArena(state.arena);
            if (state.spectatorWindow && !state.spectatorWindow.closed) {
                updateSpectatorWindow();
            }
        }

        function renderArena(arena) {
            const scoreA = sum(arena.pointsA);
            const scoreB = sum(arena.pointsB);
            const maxPoints = state.maxRounds * 2;

            return `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:0 4px;">
              <div style="font-weight:700; font-size:1.2rem; color:#1f5e3a;">
                Durchgang ${arena.round} / ${state.maxRounds}
              </div>
              <div style="font-weight:600; color:#3b5e45; background:#e8f0e8; padding:4px 16px; border-radius:30px;">
                Max. Punkte: ${maxPoints}
              </div>
            </div>
            <div class="scoreboard">
              <div class="score-card">
                <div class="team-meta">
                  <div class="team-name">⚪ ${arena.teamA}</div>
                  <div class="team-score">${scoreA}</div>
                </div>
                <div class="team-wins"><span>🏆</span> ${arena.winsA}</div>
              </div>
              <div class="score-card red">
                <div class="team-meta">
                  <div class="team-name">🔴 ${arena.teamB}</div>
                  <div class="team-score">${scoreB}</div>
                </div>
                <div class="team-wins"><span>🏆</span> ${arena.winsB}</div>
              </div>
            </div>

            <div class="kehren-grid" id="kehrenGrid">
              <div class="kehren-column">
                <div class="kehren-column-title">⚪ ${arena.teamA}</div>
                ${renderKehren(arena, 'A')}
              </div>
              <div class="kehren-column">
                <div class="kehren-column-title">🔴 ${arena.teamB}</div>
                ${renderKehren(arena, 'B')}
              </div>
            </div>
          `;
        }

        function renderKehren(arena, team) {
            let html = '';
            const arr = team === 'A' ? arena.pointsA : arena.pointsB;
            const activeIdx = activeKehre(arena) - 1;
            const maxPoints = state.playerCount;

            for (let i = 0; i < state.kehren; i++) {
                const active = (activeIdx === i);
                const isCompleted = arr[i] !== null;
                html += `
              <div class="kehre-row ${active ? 'active' : ''} ${isCompleted ? 'completed' : ''}"
                   data-kehre="${i}" data-team="${team}">
                <div class="kehre-number">${i + 1}</div>
                <div class="points-group">
                  ${Array.from({ length: maxPoints + 1 }, (_, v) => `
                    <button class="point-btn ${arr[i] === v ? 'active-point' : ''}"
                            onclick="event.stopPropagation(); setPoints('${team}', ${i}, ${v})"
                            data-value="${v}">${v}</button>
                  `).join('')}
                </div>
                <div class="kehre-value">${arr[i] ?? '–'}</div>
              </div>
            `;
            }
            return html;
        }

        // ---------- LOGIK ----------
        function setPoints(team, index, value) {
            const arena = state.arena;
            if (hasChampion(arena)) {
                toast('Meisterschaft bereits beendet');
                return;
            }

            if (team === 'A') arena.pointsA[index] = value;
            else arena.pointsB[index] = value;

            render();
        }

        function evaluateGame() {
            const arena = state.arena;
            if (hasChampion(arena)) {
                toast('Meisterschaft bereits beendet');
                return;
            }

            for (let i = 0; i < state.kehren; i++) {
                if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
                    toast('Bitte alle Kehren ausfüllen');
                    return;
                }
            }

            const a = sum(arena.pointsA);
            const b = sum(arena.pointsB);

            const historyEntry = {
                pointsA: [...arena.pointsA],
                pointsB: [...arena.pointsB],
                result: a > b ? `${arena.teamA} gewinnt` :
                    b > a ? `${arena.teamB} gewinnt` : 'Unentschieden'
            };

            if (a > b) {
                arena.winsA += 2;
                toast(`⚪ ${arena.teamA} gewinnt Durchgang ${arena.round} (${a}:${b}) → +2 Punkte`);
            } else if (b > a) {
                arena.winsB += 2;
                toast(`🔴 ${arena.teamB} gewinnt Durchgang ${arena.round} (${a}:${b}) → +2 Punkte`);
            } else {
                arena.winsA += 1;
                arena.winsB += 1;
                toast(`Unentschieden (${a}:${b}) → +1 Punkt für beide`);
            }

            state.history.push(historyEntry);

            arena.pointsA = Array(state.kehren).fill(null);
            arena.pointsB = Array(state.kehren).fill(null);
            arena.round++;

            if (arena.round > state.maxRounds) {
                if (arena.winsA > arena.winsB) {
                    toast(`🏆 MEISTERSCHAFT GEWONNEN: ${arena.teamA} mit ${arena.winsA} Punkten!`);
                } else if (arena.winsB > arena.winsA) {
                    toast(`🏆 MEISTERSCHAFT GEWONNEN: ${arena.teamB} mit ${arena.winsB} Punkten!`);
                } else {
                    toast(`🏆 MEISTERSCHAFT UNENTSCHIEDEN: Beide mit ${arena.winsA} Punkten!`);
                }
                render();
                return;
            }

            if (hasChampion(arena)) {
                const winner = arena.winsA > arena.winsB ? arena.teamA : arena.teamB;
                toast(`🏆 MEISTERSCHAFT GEWONNEN: ${winner} mit ${Math.max(arena.winsA, arena.winsB)} Punkten!`);
            } else {
                toast(`Durchgang ${arena.round - 1} abgeschlossen. Weiter mit Durchgang ${arena.round}`);
            }

            render();
        }

        function hasChampion(arena) {
            const maxPoints = state.maxRounds * 2;
            if (arena.winsA >= maxPoints || arena.winsB >= maxPoints) return true;
            if (arena.round > state.maxRounds) return true;
            return false;
        }

        function resetGame() {
            const arena = state.arena;
            arena.pointsA = Array(state.kehren).fill(null);
            arena.pointsB = Array(state.kehren).fill(null);
            arena.winsA = 0;
            arena.winsB = 0;
            arena.round = 1;
            state.history = [];
            render();
            toast('Neues Spiel gestartet');
        }

        function fullReset() {
            state.arena = createArena(1);
            state.history = [];
            render();
            toast('Kompletter Reset');
        }

        function activeKehre(arena) {
            for (let i = 0; i < state.kehren; i++) {
                if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
                    return i + 1;
                }
            }
            return state.kehren;
        }

        function sum(arr) {
            return arr.reduce((acc, v) => acc + (v || 0), 0);
        }

        // ---------- DIALOG ----------
        function openKehrenDialog() {
            const arena = state.arena;
            if (hasChampion(arena)) {
                toast('Meisterschaft beendet');
                return;
            }

            const dialog = document.getElementById('kehrenDialog');
            const select = document.getElementById('kehrenSelectDialog');
            select.innerHTML = '';

            let hasAny = false;
            for (let i = 0; i < state.kehren; i++) {
                const hasVal = (arena.pointsA[i] !== null || arena.pointsB[i] !== null);
                if (hasVal) hasAny = true;
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Kehre ${i + 1} ${hasVal ? '✏️' : '⬜'}`;
                select.appendChild(option);
            }

            if (!hasAny) {
                toast('Alle Kehren sind bereits leer');
                return;
            }

            dialog.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeKehrenDialog(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('kehrenDialog').classList.remove('show');
            document.body.style.overflow = '';
        }

        function confirmDeleteKehre() {
            const arena = state.arena;
            const select = document.getElementById('kehrenSelectDialog');
            const index = parseInt(select.value);

            if (arena.pointsA[index] === null && arena.pointsB[index] === null) {
                toast(`Kehre ${index + 1} ist bereits leer`);
                closeKehrenDialog();
                return;
            }

            arena.pointsA[index] = null;
            arena.pointsB[index] = null;
            render();
            toast(`Kehre ${index + 1} gelöscht`);
            closeKehrenDialog();
        }

        // ---------- TOAST ----------
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3200);
        }

        // ---------- INIT ----------
        function setTeamNames() {
            const nameA = prompt('Name für Mannschaft W (⚪):', 'Mannschaft W') || 'Mannschaft W';
            const nameB = prompt('Name für Mannschaft E (🔴):', 'Mannschaft E') || 'Mannschaft E';
            state.arena.teamA = nameA.trim() || 'Mannschaft W';
            state.arena.teamB = nameB.trim() || 'Mannschaft E';
            render();
        }

        render();
        setTimeout(() => {
            setTeamNames();
        }, 100);

        // Expose
        window.setPoints = setPoints;
        window.evaluateGame = evaluateGame;
        window.resetGame = resetGame;
        window.fullReset = fullReset;
        window.openKehrenDialog = openKehrenDialog;
        window.closeKehrenDialog = closeKehrenDialog;
        window.confirmDeleteKehre = confirmDeleteKehre;
        window.toast = toast;
        window.openSpectatorWindow = openSpectatorWindow;
        window.exportPDF = exportPDF;
    </script>

</body>
</html>
